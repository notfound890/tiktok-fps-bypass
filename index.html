<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIKTOK FPS UNLOCKER | PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- VARIABLES Y RESET --- */
        :root {
            --bg-color: #050505;
            --primary-red: #ff0055;
            --primary-red-dim: rgba(255, 0, 85, 0.1);
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-dark: #222222;
            --font-heading: 'Rubik', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-heading);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 40px;
        }

        /* --- FONDO DECORATIVO ANIMADO (Estilo Matriz Sutil) --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(var(--primary-red-dim) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(5, 5, 5, 0) 0%, var(--bg-color) 100%);
            background-size: 40px 40px, 100% 100%;
            z-index: -1;
            opacity: 0.5;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px;
            border-bottom: 1px solid var(--border-dark);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        .logo span {
            color: var(--primary-red);
            text-shadow: 0 0 5px var(--primary-red);
        }
        .menu-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .menu-icon div {
            width: 100%;
            height: 2px;
            background: var(--text-main);
            border-radius: 2px;
        }

        /* --- SECCIÓN HERO --- */
        .hero {
            padding: 40px 20px 30px 20px;
            text-align: center;
            position: relative;
        }
        .hero-sub {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--primary-red);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 20px;
            /* EFECTO GLITCH EN TÍTULO */
            position: relative;
            display: inline-block;
        }
        .hero h1::before, .hero h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .hero h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-cyan);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .hero h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--primary-red);
            clip: rect(86px, 450px, 140px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            $steps: 20;
            @for $i from 0 through$steps {
                #{percentage($i*(1/$steps))} {
                    clip: rect(random(150)+px, 9999px, random(150)+px, 0);
                }
            }
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto 30px auto;
        }
        .decor-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-red), transparent);
            margin: 0 auto 30px auto;
        }

        /* --- CONTENEDOR PRINCIPAL DE PASOS --- */
        .main-container {
            padding: 0 20px;
            max-width: 550px;
            margin: 0 auto;
        }

        .step-wrapper {
            margin-bottom: 40px;
            position: relative;
        }
        
        /* Línea vertical decorativa de los pasos */
        .step-wrapper::before {
            content: "";
            position: absolute;
            left: 15px;
            top: 30px;
            bottom: -10px;
            width: 1px;
            background-color: var(--border-dark);
            z-index: -1;
        }

        .step-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .step-num {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-red);
            width: 40px;
            height: 40px;
            background-color: rgba(25, 25, 25, 0.8);
            border: 1px solid var(--border-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            position: relative;
        }
        /* Brillo alrededor del número */
        .step-num::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 1px solid var(--primary-red);
            border-radius: 50%;
            opacity: 0.5;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .step-title-area h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .step-title-area p {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- PASO 1: UPLOAD (Diseño Mejorado) --- */
        .upload-zone {
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        /* Efecto de borde neón al hover */
        .upload-zone::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            padding: 2px; 
            background: linear-gradient(45deg, var(--primary-red), var(--accent-cyan), var(--primary-red));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .upload-zone:hover::before {
            opacity: 1;
        }
        .upload-zone:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary-red);
        }
        .upload-zone h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .upload-zone p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .file-btn {
            background: linear-gradient(90deg, var(--primary-red), #ff4d88);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            cursor: pointer;
        }

        /* --- PASO 2: METHOD (Tarjetas Decoradas) --- */
        .method-card {
            background: #111111;
            border: 1px solid var(--primary-red);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }
        .method-card.disabled {
            border-color: var(--border-dark);
            background: #080808;
            box-shadow: none;
        }
        .status-dot {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            color: var(--accent-cyan);
        }
        .status-dot::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        .method-card.disabled .status-dot {
            color: var(--text-muted);
        }
        .method-card.disabled .status-dot::before {
            background-color: var(--border-dark);
            box-shadow: none;
        }
        .method-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .method-card.disabled .method-icon {
            color: var(--text-muted);
        }
        .method-card h4 {
            font-size: 1rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .method-details {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* --- PASO 3: RENDER (Con barra de estado futurista) --- */
        .render-box {
            background: #111111;
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }
        .spinner-circle {
            width: 80px;
            height: 80px;
            border: 3px solid var(--border-dark);
            border-top-color: var(--primary-red);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 1s linear infinite;
            position: relative;
        }
        .spinner-circle::after {
            content: "⚡";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-info {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            color: var(--accent-
